.arcade{font-family:"Courier New","Lucida Console",monospace;font-weight:700;letter-spacing:.08em;}
@keyframes blink{0%,100%{opacity:1}49%{opacity:1}50%{opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0) translateX(-50%)}50%{transform:translateY(-5px) translateX(-50%)}}

@keyframes floatUp{0%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0;transform:translateX(-50%) translateY(-42px)}}
@keyframes titleGlow{0%,100%{text-shadow:0 0 10px #F4A62A,0 0 20px #F4A62A}50%{text-shadow:0 0 20px #F4A62A,0 0 40px #F4A62A,0 0 60px #F4A62A}}
@keyframes keyPulseL{0%,100%{transform:translateX(0);background:#fff}50%{transform:translateX(-5px);background:#f5e6cc}}
@keyframes keyPulseR{0%,100%{transform:translateX(0);background:#fff}50%{transform:translateX(5px);background:#f5e6cc}}
html[data-sweet-catch-embedded="true"],
html[data-sweet-catch-embedded="true"] body,
html[data-sweet-catch-embedded="true"] *,
html[data-sweet-catch-embedded="true"] *::before,
html[data-sweet-catch-embedded="true"] *::after{cursor:none !important;}
/* Desktop — keyboard; hide touch chrome */
@media (min-width:769px) and (pointer:fine){
  #sndBtn{display:none!important;}
  #touchRow{display:none!important;}
}
/* Phone touch — centered paddles (thumb-friendly); skipped when parent marks iPad/tablet */
@media (max-width:719px){
  html:not([data-sweet-catch-tablet="true"]) #touchRow{display:flex!important;justify-content:center;gap:12px;width:calc(100% - 24px);max-width:360px;margin-left:auto;margin-right:auto;left:0!important;right:0!important;transform:none!important;bottom:10px!important;z-index:9!important;padding-bottom:env(safe-area-inset-bottom,.5rem);}
  html:not([data-sweet-catch-tablet="true"]) #sndBtn{display:flex!important;}
}
/* iPad / tablet touch — ← left edge, → right edge (data attr: iframe is often <720px wide) */
html[data-sweet-catch-tablet="true"] #touchRow{display:flex!important;justify-content:space-between!important;align-items:flex-end;width:calc(100% - 28px)!important;max-width:none!important;margin:0!important;left:14px!important;right:14px!important;transform:none!important;bottom:clamp(12px,2.5vh,18px)!important;z-index:9!important;gap:0!important;padding-bottom:env(safe-area-inset-bottom,.5rem);}
html[data-sweet-catch-tablet="true"] #touchRow #kL,
html[data-sweet-catch-tablet="true"] #touchRow #kR{width:clamp(58px,11vw,76px)!important;height:clamp(58px,11vw,76px)!important;font-size:clamp(22px,4.5vw,28px)!important;border-radius:12px!important;box-shadow:0 5px 0 #1a1208!important;flex-shrink:0;}
html[data-sweet-catch-tablet="true"] #sndBtn{display:flex!important;bottom:clamp(80px,18vw,96px)!important;left:14px!important;}
@media (min-width:720px) and (pointer:coarse){
  #touchRow{display:flex!important;justify-content:space-between!important;align-items:flex-end;width:calc(100% - 28px)!important;max-width:none!important;margin:0!important;left:14px!important;right:14px!important;transform:none!important;bottom:clamp(12px,2.5vh,18px)!important;z-index:9!important;gap:0!important;padding-bottom:env(safe-area-inset-bottom,.5rem);}
  #touchRow #kL,#touchRow #kR{width:clamp(58px,11vw,76px)!important;height:clamp(58px,11vw,76px)!important;font-size:clamp(22px,4.5vw,28px)!important;border-radius:12px!important;box-shadow:0 5px 0 #1a1208!important;flex-shrink:0;}
  #sndBtn{display:flex!important;bottom:clamp(80px,18vw,96px)!important;left:14px!important;}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;}
}
</style>

function makeCakeSVG(z){
  const c=DARK_COLS[Math.floor(Math.random()*DARK_COLS.length)];
  const p=CAKE_PATHS[Math.floor(Math.random()*CAKE_PATHS.length)];
  return `<svg width="${z}" height="${z}" viewBox="-5 -10 110 135" xmlns="http://www.w3.org/2000/svg"><path fill="${c}" d="${p}"/></svg>`;
}
function makeBombSVG(z){return`<svg width="${z}" height="${z}" viewBox="0 0 100 100"><circle cx="50" cy="58" r="34" fill="#1a1208"/><circle cx="38" cy="46" r="8" fill="white" opacity=".18"/><rect x="47" y="16" width="6" height="20" rx="3" fill="#666"/><path d="M52 16 Q62 8 68 14" stroke="#F4A62A" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="68" cy="13" r="5" fill="#F4A62A"/></svg>`;}

const MAX_ITEMS=lowPowerMode?8:12;
const SPRITE_POOL={cakes:[],bomb:''};
(function initSpritePool(){
  for(var i=0;i<6;i++)SPRITE_POOL.cakes.push(makeCakeSVG(32+(i%3)*8));
  SPRITE_POOL.bomb=makeBombSVG(40);
})();
function pickSprite(isBomb){return isBomb?SPRITE_POOL.bomb:SPRITE_POOL.cakes[Math.floor(Math.random()*SPRITE_POOL.cakes.length)];}

function bindTouchMovePad() {
  function wire(el, key) {
    if (!el) return;
    const down = function (ev) {
      if (ev.type === 'touchstart') ev.preventDefault();
      keys[key] = true;
    };
    const up = function () {
      keys[key] = false;
    };
    el.addEventListener('touchstart', down, { passive: false });
    el.addEventListener('touchend', up);
    el.addEventListener('touchcancel', up);
    el.addEventListener('mousedown', function (e) {
      if (e.button === 0) keys[key] = true;
    });
    el.addEventListener('mouseup', up);
    el.addEventListener('mouseleave', up);
  }
  wire(kL, 'l');
  wire(kR, 'r');
}

bindTouchMovePad();
(function bindSoundToggle(){
  const b=document.getElementById('sndBtn');
  if(!b)return;
  updateSoundBtn();
  b.addEventListener('pointerdown',function(ev){ev.preventDefault();toggleSoundMuted();},{passive:false});
  b.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleSoundMuted();}});
})();

function updateLives(){livesHud.textContent='♥'.repeat(lives)||'';livesHud.style.color=lives===1?'#EF4444':'#E85D75';}
function updateScore(){scEl.textContent=String(score).padStart(2,'0');}

/** Bomba çarpması — can / puan / animasyon (true = game over). */
function applyBombPenalty(){
  playBomb();floatEmoji('!',elfX);
  score=Math.max(0,score-1);updateScore();
  floatText('-1',elfX+28,'#EF4444');
  lives--;updateLives();randomElfColor();
  chrEl.style.animation='bombHit 0.4s ease';
  scene.style.background='#ffe8e8';
  setTimeout(()=>{scene.style.background='#FDF8F3';if(gameOn)chrEl.style.animation='bob 0.5s ease-in-out infinite';},380);
  return lives<=0;
}

function spawnItem(){
  if(!gameOn||items.length>=MAX_ITEMS)return;
  const sw=sceneW();
  const isBomb=Math.random()<0.22;
  const z=32+Math.floor(Math.random()*22);
  const x=16+Math.random()*Math.max(8,sw-70);
  const speed=55+Math.random()*42;
  const el=document.createElement('div');
  el.style.cssText=`position:absolute;left:${x}px;top:${CLOUD_BOTTOM}px;pointer-events:none;will-change:transform;`;
  el.innerHTML=pickSprite(isBomb);
  sl.appendChild(el);
  items.push({el,cx:x+z/2,y:0,speed,isBomb,done:false});
}

function floatText(t,x,color){const p=document.createElement('div');p.className='arcade';p.style.cssText=`position:absolute;left:${x}px;bottom:155px;font-size:9px;pointer-events:none;color:${color};animation:floatUp 0.6s ease forwards;transform:translateX(-50%);`;p.textContent=t;pt.appendChild(p);setTimeout(()=>p.parentNode&&p.parentNode.removeChild(p),620);}
function floatEmoji(e,x){const p=document.createElement('div');p.style.cssText=`position:absolute;left:${x}px;bottom:152px;font-size:20px;pointer-events:none;animation:floatUp 0.55s ease forwards;transform:translateX(-50%);`;p.textContent=e;pt.appendChild(p);setTimeout(()=>p.parentNode&&p.parentNode.removeChild(p),580);}

function doDeath(){gameOn=false;paused=false;cancelAnimationFrame(raf);spawnAccumulator=0;unbindTitlePulse();pauseBtn.style.display='none';oP.style.display='none';playDeath();chrEl.style.animation='death 0.9s ease forwards';scene.style.background='#ffe0e0';setTimeout(()=>{scene.style.background='#FDF8F3';finalSc.textContent=score;oD.style.display='flex';},980);}

function loop(ts){
  if(!gameOn)return;
  const dt=last?Math.min((ts-last)/1000,0.05):0.016;last=ts;
  spawnAccumulator+=dt;
  while(spawnAccumulator>=SPAWN_EVERY_S){
    spawnAccumulator-=SPAWN_EVERY_S;
    spawnItem();
  }
  const SP=280;
  const sw=sceneW();const sh=sceneH();const pad=ELF_HALF;
  elfX=Math.max(pad,Math.min(sw-pad,elfX));
  if(keys.l){elfX=Math.max(pad,elfX-SP*dt);kL.style.background='#f5e6cc';}else kL.style.background='rgba(255,255,255,0.85)';
  if(keys.r){elfX=Math.min(sw-pad,elfX+SP*dt);kR.style.background='#f5e6cc';}else kR.style.background='rgba(255,255,255,0.85)';
  chrEl.style.left=elfX+'px';
  if(keys.l)elfS.style.transform='scaleX(-1)';else if(keys.r)elfS.style.transform='scaleX(1)';
  const catchY=sh-44-95;
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];if(it.done)continue;
    it.y+=it.speed*dt;it.el.style.transform=`translateY(${it.y}px)`;
    if(it.y>catchY-CLOUD_BOTTOM-10&&it.y<catchY-CLOUD_BOTTOM+80&&Math.abs(it.cx-elfX)<58){
      it.done=true;it.el.style.visibility='hidden';
      items.splice(i,1);it.el.parentNode&&it.el.parentNode.removeChild(it.el);
      if(it.isBomb){
        if(applyBombPenalty()){doDeath();return;}
      }else{
        playCollect();floatEmoji('+',elfX);
        score++;updateScore();
        floatText('+1',elfX-28,'#4DB8A4');
        if(score>=15){endGame();return;}
      }
    }else if(it.y>sh-CLOUD_BOTTOM+20){items.splice(i,1);it.el.parentNode&&it.el.parentNode.removeChild(it.el);}
  }
  raf=requestAnimationFrame(loop);
}

function pauseGame(){
  if(!gameOn||paused)return;
  parentSuspended=false;paused=true;cancelAnimationFrame(raf);
  pauseBtn.textContent='▶ CONTINUE';
  oP.style.display='flex';
}
function resumeGame(){
  if(!gameOn||!paused)return;
  paused=false;last=0;
  pauseBtn.textContent='⏸ PAUSE';
  oP.style.display='none';
  raf=requestAnimationFrame(loop);
}
function togglePause(){if(paused)resumeGame();else pauseGame();}

function startGame(){
  getCtx();unbindTitlePulse();oS.style.display='none';parentSuspended=false;
  score=0;lives=3;elfX=sceneW()/2;gameOn=true;paused=false;last=0;spawnAccumulator=0;
  updateScore();updateLives();randomElfColor();
  sl.innerHTML='';pt.innerHTML='';items.length=0;
  chrEl.style.left=elfX+'px';chrEl.style.opacity='1';
  chrEl.style.animation='bob 0.5s ease-in-out infinite';
  pauseBtn.style.display='inline-flex';pauseBtn.textContent='⏸ PAUSE';
  spawnItem();spawnItem();spawnItem();
  raf=requestAnimationFrame(loop);
}
function endGame(){gameOn=false;paused=false;cancelAnimationFrame(raf);spawnAccumulator=0;unbindTitlePulse();chrEl.style.animation='none';pauseBtn.style.display='none';oP.style.display='none';winScore.textContent=score;oW.style.display='flex';}
function resetGame(){oW.style.display='none';oD.style.display='none';oP.style.display='none';sl.innerHTML='';pt.innerHTML='';items.length=0;chrEl.style.opacity='1';randomElfColor();startGame();}
function quitToTitle(){
  gameOn=false;paused=false;
  parentSuspended=false;
  cancelAnimationFrame(raf);
  spawnAccumulator=0;
  keys.l=keys.r=false;
  kL.style.background='rgba(255,255,255,0.85)';
  kR.style.background='rgba(255,255,255,0.85)';
  oW.style.display='none';
  oD.style.display='none';
  oP.style.display='none';
  pauseBtn.style.display='none';
  oS.style.display='flex';
  sl.innerHTML='';
  pt.innerHTML='';
  items.length=0;
  score=0;
  lives=3;
  elfX=sceneW()/2;
  last=0;
  chrEl.style.left=elfX+'px';
  chrEl.style.opacity='1';
  chrEl.style.animation='none';
  elfS.style.transform='scaleX(1)';
  scene.style.background='#FDF8F3';
  updateScore();
  updateLives();
  randomElfColor();
  bindTitlePulse();
}

/** Parent page visibility — pause timers/RAF when section scrolls off-screen. */
function suspendEmbedded(){
  unbindTitlePulse();
  if(gameOn&&!paused){
    parentSuspended=true;
    paused=true;
    cancelAnimationFrame(raf);
    spawnAccumulator=0;
  }
}
function resumeEmbedded(){
  if(gameOn&&parentSuspended){
    parentSuspended=false;
    paused=false;
    last=0;
    pauseBtn.textContent='⏸ PAUSE';
    oP.style.display='none';
    raf=requestAnimationFrame(loop);
  }else if(!gameOn&&oS&&oS.style.display!=='none'){
    bindTitlePulse();
  }
}
window.addEventListener('message',function(e){
  var O=(typeof window.location.origin==='string'&&window.location.origin)?window.location.origin:'*';
  if(e.origin!==O&&O!=='*')return;
  var d=e.data;
  if(!d||typeof d!=='object')return;
  if(d.type==='sweet-catch-suspend')suspendEmbedded();
  else if(d.type==='sweet-catch-resume')resumeEmbedded();
  else if(d.type==='sweet-catch-layout')syncTabletTouchLayout(!!d.tabletTouch);
});
function syncTabletTouchLayout(tablet){
  if(tablet)document.documentElement.setAttribute('data-sweet-catch-tablet','true');
  else document.documentElement.removeAttribute('data-sweet-catch-tablet');
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden)suspendEmbedded();
  else resumeEmbedded();
});

(function(){
var O=(typeof window.location.origin==='string'&&window.location.origin)?window.location.origin:'*';

document.documentElement.setAttribute('data-sweet-catch-embedded','true');
try{
  var _tabMq=window.parent.matchMedia('(min-width:721px) and (pointer:coarse)');
  function _syncTab(){syncTabletTouchLayout(_tabMq.matches);}

/* Relay pointer in parent viewport coords. Iframe-local mouse coords go stale when
   the parent scrolls without a mousemove — that was teleporting the knife cursor. */
var _r=fe.getBoundingClientRect();
var _rectDirty=false;
var _hovering=false;
var _lastViewport=null;
var _parentListeners=false;

function _flushPointer(vx,vy){
  _lastViewport={vx:vx,vy:vy};
  window.parent.postMessage({type:'sweet-catch-pointer',vx:vx,vy:vy,grow:false},O);
}

function _markDirty(){
  _rectDirty=true;
  /* Mouse is fixed in viewport while parent scrolls — resend last viewport point. */
  if(_lastViewport)_flushPointer(_lastViewport.vx,_lastViewport.vy);
}

function _bindParentListeners(){
  if(_parentListeners)return;
  _parentListeners=true;
  window.parent.addEventListener('resize',_markDirty,{passive:true});
  window.parent.addEventListener('scroll',_markDirty,{passive:true,capture:true});
}
function _unbindParentListeners(){
  if(!_parentListeners)return;
  _parentListeners=false;
  window.parent.removeEventListener('resize',_markDirty);
  window.parent.removeEventListener('scroll',_markDirty,{capture:true});
}

function _onEnter(){
  _hovering=true;
  _r=fe.getBoundingClientRect();
  _rectDirty=false;
  _bindParentListeners();
}
function _onLeave(){
  _hovering=false;
  _unbindParentListeners();
  var msg={type:'sweet-catch-pointer-leave'};
  if(_lastViewport){
    msg.vx=_lastViewport.vx;
    msg.vy=_lastViewport.vy;
  }
  window.parent.postMessage(msg,O);
  _lastViewport=null;
}
document.addEventListener('mouseenter',_onEnter,{passive:true});
document.addEventListener('mouseleave',_onLeave,{passive:true});
document.addEventListener('mousemove',function(ev){
  if(!_hovering)return;
  if(_rectDirty){_r=fe.getBoundingClientRect();_rectDirty=false;}
  _flushPointer(_r.left+ev.clientX,_r.top+ev.clientY);
},{passive:true});
if(typeof ResizeObserver!=='undefined'){
  try{
    new ResizeObserver(function(){if(_hovering)_markDirty();}).observe(fe);
  }catch(_e){}
}
document.addEventListener('mousedown',function(ev){if(ev.button===0&&_hovering)window.parent.postMessage({type:'sweet-catch-click'},O);},{passive:true});
})();
